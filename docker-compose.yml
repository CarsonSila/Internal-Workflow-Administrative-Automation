services:
  backend:
    build: .
    environment:
      MOCK_DATA_DIR: /app/mock_data
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-before-production}
    ports:
      - "8000:8000"
    volumes:
      - ./mock_data:/app/mock_data
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
